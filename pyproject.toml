[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-stack-review"
version = "0.2.0"
description = "Isolated, resumable PR stack reviews for Hermes and Claude Code"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
stack-review = "stack_review.cli:main"

[tool.setuptools.packages.find]
include = ["stack_review*"]

[tool.setuptools.package-data]
stack_review = ["skills/*/*.md", "workflow.md"]
